<!-- iOS-versie. Geen eigen afronding: iOS snijdt zelf bij op zijn systeemvorm, en met
     een ingetekende afronding bleef er een wit randje over als die twee niet precies
     samenvielen. Het verloop loopt daarom door tot de rand.
     De tekening houdt WEL zijn oorspronkelijke formaat: iOS snijdt veel minder weg dan
     Android bij een maskeerbaar pictogram, dus verkleinen zou hem onnodig klein maken. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ec6e8"/>
      <stop offset="100%" stop-color="#1a8a54"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#sky)"/>
  <ellipse cx="50" cy="72" rx="27" ry="7" fill="#136b3f"/>
  <rect x="47" y="26" width="5" height="46" fill="#e8c766"/>
  <path d="M52 28 L77 36 L52 45 Z" fill="#d94b3c"/>
  <circle cx="68" cy="66" r="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
</svg>
